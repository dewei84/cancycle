<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow { 50% { transform: scale(1.08); } }
    .rays { transform-origin: 28px 28px; animation: spin 18s linear infinite; }
    .core { transform-origin: 28px 28px; animation: glow 3.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .rays, .core { animation: none; } }
  </style>
  <g class="rays" stroke="#B5651D" stroke-width="2.4" stroke-linecap="round">
    <path d="M28 6 L28 11"/><path d="M28 45 L28 50"/><path d="M6 28 L11 28"/><path d="M45 28 L50 28"/>
    <path d="M12.4 12.4 L16 16"/><path d="M40 40 L43.6 43.6"/><path d="M12.4 43.6 L16 40"/><path d="M40 16 L43.6 12.4"/>
  </g>
  <circle class="core" cx="28" cy="28" r="9" fill="#C7792A" fill-opacity="0.35" stroke="#B5651D" stroke-width="2.4"/>
</svg>
