name: fetch-forecast-fixture
on:
  push:
    branches: [feat/rain-forecast]
    paths: [.github/workflows/fetch-forecast.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the 2-hour forecast
        run: |
          set -e
          date -u
          curl -sS -D tests/fixtures/two-hr-forecast-headers.txt -H 'Origin: https://dewei84.github.io' \
            -o tests/fixtures/two-hr-forecast-latest.json \
            https://api-open.data.gov.sg/v2/real-time/api/two-hr-forecast
          python3 -m json.tool tests/fixtures/two-hr-forecast-latest.json > /dev/null
      - name: Commit the fixture
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tests/fixtures/two-hr-forecast-latest.json tests/fixtures/two-hr-forecast-headers.txt
          git commit -m "Save a real 2-hour forecast response as a test fixture"
          git push
